   <form action="#" method="post" enctype="multipart/form-data">
      <label for="lname">Last Name:</label>
      <input type="text" id="lname" name="lastname" required><br><br>

      <label for="fname">First Name:</label>
      <input type="text" id="fname" name="firstname" required><br><br>

      <label for="dob">Date of Birth:</label>
      <input type="date" id="dob" name="dob" required><br><br>

      <label>Gender:</label>
      <input type="radio" id="male" name="gender" value="Male" checked>
      <label for="male">Male</label>
      <input type="radio" id="female" name="gender" value="Female">
      <label for="female">Female</label><br><br>

      <label for="country">Country:</label>
      <select id="country" name="country" required>
        <option value="">--Select--</option>
        <option value="Tunisia" selected>Tunisia</option>
        <option value="France">France</option>
        <option value="USA">USA</option>
        <option value="Other">Other</option>
      </select><br><br>

      <label>Languages:</label>
      <input type="checkbox" id="arabic" name="language" value="Arabic">
      <label for="arabic">Arabic</label>
      <input type="checkbox" id="french" name="language" value="French">
      <label for="french">French</label>
      <input type="checkbox" id="english" name="language" value="English">
      <label for="english">English</label><br><br>

      <label for="image">Image:</label><br>
      <input type="file" id="image" name="image"><br><br>

      <input type="submit" value="Submit">
    </form>
